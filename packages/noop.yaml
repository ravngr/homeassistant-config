---
pkg_noop:
  script:
    noop:
      alias: "[pkg_noop] No-Operation "
      description: "A dummy null/no-op script ($GitDate$)"
      icon: "mdi:stop"
      mode: restart
      sequence: []

  template:
    - light:
        - unique_id: eddf2a92-3b76-4b3d-8e0c-8d7e25011af4
          turn_on: &noop-sevice
            - action: script.noop
          turn_off: *noop-sevice
          default_entity_id: light.dummy
          icon: mdi:lightbulb-off-outline
          name: Dummy Light
          state: "off"

    - switch:
        - unique_id: 827f1afa-8032-41e4-99b0-5e1c673b944c
          turn_on: *noop-sevice
          turn_off: *noop-sevice
          default_entity_id: switch.dummy
          icon: mdi:toggle-switch-off-outline
          name: Dummy Switch
          state: "off"
