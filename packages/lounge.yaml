---
pkg_lounge:
  template:
    - switch:
        - unique_id: 8452ac8c-f15c-4a00-aa2d-3d9561d9d2b7
          turn_on:
            - action: button.press
              target:
                entity_id:
                  - button.esphome_lounge_tv_power
            - action: script.wake_lounge_htpc
          turn_off:
            - action: button.press
              target:
                entity_id:
                  - button.esphome_lounge_tv_power
          default_entity_id: switch.lounge_tv
          icon: mdi:television
          availability: >-
            {{
              not is_state(
                states('sensor.secret_forecast_weather_entity_id'),
                [
                  'unknown',
                  'unavailable'
                ]
              )
            }}
          name: Lounge TV
          state: >-
            {{
              states('sensor.zb_lounge_socket_tv_power') |
              float(0) > 10
            }}
